name: Deploy to Production

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'client/**'
      - 'docker-compose.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cgms-backend:latest,ghcr.io/${{ github.repository_owner }}/cgms-backend:${{ github.sha }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cgms-frontend:latest,ghcr.io/${{ github.repository_owner }}/cgms-frontend:${{ github.sha }}

  # Note: A deployment job (e.g. SSH into server, run docker-compose pull && docker-compose up -d) 
  # would be added here depending on the target hosting provider (AWS, DigitalOcean, etc.)
