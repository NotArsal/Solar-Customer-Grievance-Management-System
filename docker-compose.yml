version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cgms_backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    volumes:
      - ./server/.env:/app/.env
    restart: unless-stopped
    environment:
      - NODE_ENV=production

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: cgms_frontend
    ports:
      - "80:80"
    env_file:
      - ./client/.env
    restart: unless-stopped
    depends_on:
      - server
